name: Release

on:
  push:
    tags:
      - 'V*'

env:
  # Written into every new updates.xml entry; Joomla matches it with preg_match('/^' . version . '/', JVERSION).
  # Joomla 5.4+ and 6.x, the minimum enforced by script.php.
  TARGET_PLATFORM: '(5\.[4-9]|6)\..*'

jobs:
  update-xml:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract version and build download URL
        id: vars
        run: |
          TAG="${GITHUB_REF_NAME}"
          VERSION="${TAG#V}"
          ZIP_URL="https://github.com/${{ github.repository }}/archive/refs/tags/${TAG}.zip"
          echo "tag=${TAG}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "zip_url=${ZIP_URL}" >> $GITHUB_OUTPUT

      - name: Download release zip and compute SHA256
        id: sha256
        run: |
          curl -fL -o release.zip "${{ steps.vars.outputs.zip_url }}"
          SHA=$(sha256sum release.zip | awk '{print $1}')
          if ! [[ "${SHA}" =~ ^[a-f0-9]{64}$ ]]; then
            echo "::error::Could not compute a SHA-256 for ${{ steps.vars.outputs.zip_url }}"
            exit 1
          fi
          echo "value=${SHA}" >> $GITHUB_OUTPUT

      - name: Append entry to updates.xml
        env:
          VERSION: ${{ steps.vars.outputs.version }}
          ZIP_URL: ${{ steps.vars.outputs.zip_url }}
          SHA256: ${{ steps.sha256.outputs.value }}
        run: |
          python3 - <<'EOF'
          import re, os

          version  = os.environ["VERSION"]
          zip_url  = os.environ["ZIP_URL"]
          sha256   = os.environ["SHA256"]
          platform = os.environ["TARGET_PLATFORM"]

          if not re.fullmatch(r"[a-f0-9]{64}", sha256):
              raise SystemExit(f"Invalid SHA-256: {sha256!r}")

          with open("updates.xml", "r") as f:
              content = f.read()

          if f"<version>{version}</version>" in content:
              print(f"Version {version} already exists, skipping.")
              raise SystemExit(0)

          # Extract the last <update> block as a template
          blocks = re.findall(r'<update>.*?</update>', content, re.DOTALL)
          if not blocks:
              raise SystemExit("No existing <update> block found to use as template.")
          last = blocks[-1]

          # Point the download at this repository and tag
          new_block = re.sub(
              r'(<downloadurl[^>]*>).*?(</downloadurl>)',
              lambda m: f"{m.group(1)}\n                {zip_url}\n            {m.group(2)}",
              last,
              flags=re.DOTALL
          )

          # Update <version> tag
          old_version = re.search(r'<version>([^<]+)</version>', last).group(1).strip()
          new_block = new_block.replace(
              f'<version>{old_version}</version>',
              f'<version>{version}</version>'
          )

          # Update version in <name> if present
          new_block = re.sub(
              r'(<name>[^<]*?)' + re.escape(old_version) + r'([^<]*</name>)',
              lambda m: m.group(0).replace(old_version, version, 1),
              new_block
          )

          # Update sha256 (also when the template's hash is empty)
          new_block = re.sub(r'<sha256>[^<]*</sha256>', f'<sha256>{sha256}</sha256>', new_block)

          # Write targetplatform explicitly instead of inheriting it
          new_block = re.sub(
              r'<targetplatform[^>]*/>',
              lambda m: f'<targetplatform name="joomla" version="{platform}"/>',
              new_block
          )

          # Detect indentation of the last block and match it
          indent = re.findall(r'^([ \t]*)<update>', content, re.MULTILINE)[-1]
          new_block = indent + new_block.lstrip()

          content = content.replace('</updates>', new_block + '\n</updates>')
          with open("updates.xml", "w") as f:
              f.write(content)
          print(f"Added version {version} (sha256: {sha256})")
          EOF

      - name: Commit and push updated updates.xml
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add updates.xml
          git diff --cached --quiet && echo "No changes to commit" && exit 0
          git commit -m "chore: add updates.xml entry for ${{ steps.vars.outputs.tag }}"
          git push origin main
